name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (PSScriptAnalyzer)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force -Scope CurrentUser

      - name: Analyze
        run: |
          $ErrorActionPreference = 'Stop'

          # Scoped to shipping code. Test files are validated by being executed,
          # and Pester's $script: scoping trips analyzer rules that do not apply.
          $targets = @('./src', './bootstrap', './tools', './ts.ps1') |
              Where-Object { Test-Path -LiteralPath $_ }

          if (-not $targets) {
              Write-Host 'No analyzable targets yet; skipping.'
              exit 0
          }

          $findings = Invoke-ScriptAnalyzer -Path $targets -Recurse -Settings ./PSScriptAnalyzerSettings.psd1

          if ($findings) {
              $findings |
                  Select-Object Severity, RuleName, ScriptName, Line, Message |
                  Format-Table -AutoSize |
                  Out-String -Width 200 |
                  Write-Host
              throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: test (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both legs are required. The 5.1 leg is the only thing that catches
          # cross-edition defects in the bootstrap, which by definition runs
          # before PowerShell 7 exists on a clean machine.
          - label: Windows PowerShell 5.1
            shell: powershell
          - label: PowerShell 7
            shell: pwsh
    # Declared here rather than on each step, and that is a requirement rather
    # than a tidy-up. The matrix context is not available to
    # jobs.<id>.steps[*].shell, so putting the expression on a step is a workflow
    # parse error - Unrecognized named-value: 'matrix' - which fails both legs
    # before any PowerShell executes. jobs.<id>.defaults.run does see the matrix
    # and applies to every run step in the job.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - name: Report engine
        run: $PSVersionTable | Format-List | Out-String | Write-Host

      - name: Install Pester
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # Windows PowerShell 5.1 ships PowerShellGet 1.0.0.1, which asks for the
          # NuGet provider interactively the first time it installs anything. There
          # is nobody on a runner to answer that prompt, so the leg would fail for a
          # reason that has nothing to do with Pester or with this project.
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          }

          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck -AllowClobber

      - name: Run tests
        run: ./tests/Invoke-Tests.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.shell }}
          path: testresults.xml
          if-no-files-found: ignore
